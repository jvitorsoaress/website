<header class="site-header">
  <nav class="navbar" [class.scrolled]="isScrolled" aria-label="Main navigation">
    <div class="nav-shell">
      <a class="brand-name" routerLink="/" (click)="collapse()" aria-label="João Vitor Soares home">
        <span aria-hidden="true">/</span> JV
      </a>

      <button class="navbar-toggler" type="button" (click)="toggle()"
              [attr.aria-expanded]="isExpanded" aria-controls="main-menu" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
      </button>

      <div id="main-menu" class="navbar-collapse" [class.show]="isExpanded">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" routerLink="/" routerLinkActive="link-active" [routerLinkActiveOptions]="{ exact: true }" (click)="collapse()">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/projects" routerLinkActive="link-active" (click)="collapse()">Projects</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/" fragment="services" (click)="collapse()">Services</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/contact" routerLinkActive="link-active" (click)="collapse()">Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
