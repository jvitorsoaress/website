<header class="fixed-top">
  <nav class="navbar navbar-expand-sm box-shadow" [class.scrolled]="isScrolled">
    <div class="container">

      <a class="navbar-brand fw-bold d-flex align-items-center" routerLink="/">
        <img src="/logo.png" alt="Logo" class="logo me-2">
        <span class="brand-name">/ Vitor</span>
      </a>

      <button class="navbar-toggler" type="button" (click)="toggle()">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse"
           [ngClass]="{ show: isExpanded }">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/projects">Projects</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#services">Services</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/contact"
               routerLinkActive="link-active">
              Contact
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
