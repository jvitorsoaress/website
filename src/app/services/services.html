<section id="services" class="services-section" aria-labelledby="services-title">
  <div class="section-heading">
    <p class="eyebrow">{{ languageService.t('services.eyebrow') }}</p>
    <h2 id="services-title">{{ languageService.t('services.title') }}</h2>
  </div>
  <div class="services-grid">
    <article class="service" *ngFor="let service of services">
      <span class="service-icon" aria-hidden="true" [ngSwitch]="service.icon">
        <svg *ngSwitchCase="'backend'" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-12-2 14"></path></svg>
        <svg *ngSwitchCase="'modernization'" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"></path><path d="M5.6 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.4-3"></path></svg>
        <svg *ngSwitchCase="'integrations'" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="6" rx="1"></rect><rect x="14" y="14" width="7" height="6" rx="1"></rect><path d="M10 7h3a3 3 0 0 1 3 3v4"></path></svg>
      </span>
      <h3>{{ languageService.t(service.title) }}</h3>
      <p>{{ languageService.t(service.desc) }}</p>
    </article>
  </div>
</section>
