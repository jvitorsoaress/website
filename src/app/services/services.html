<section id="services" class="services-section" aria-labelledby="services-title">
  <div class="section-heading">
    <p class="eyebrow">{{ languageService.t('services.eyebrow') }}</p>
    <h2 id="services-title">{{ languageService.t('services.title') }}</h2>
  </div>
  <div class="services-grid">
    <article class="service" *ngFor="let service of services">
      <h3>{{ languageService.t(service.title) }}</h3>
      <p>{{ languageService.t(service.desc) }}</p>
    </article>
  </div>
</section>
